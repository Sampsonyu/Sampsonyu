name: Refresh profile cards

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Sampsonyu/Sampsonyu'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public cards
        run: python3 scripts/refresh_cards.py
      - name: Save refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile statistics'
            git push
          fi
